name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./EnterpriseOperationsAPI.slnx

      - name: Build solution
        run: dotnet build ./EnterpriseOperationsAPI.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --solution ./EnterpriseOperationsAPI.slnx --configuration Release --no-build